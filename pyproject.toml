[project]
name = "mcp-doc-tools"
version = "0.2.0"
description = "MCP server with local document tools: read scans (OCR), work with PDFs, shrink photos. Also checks your own websites and project folders. Runs on your computer, inside one folder."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Davyd Medvedchuk" }]
dependencies = ["mcp>=2", "pypdf", "pypdfium2", "pytesseract", "Pillow", "pillow-heif", "numpy"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
doc-tools = "doc_tools.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["doc_tools"]
